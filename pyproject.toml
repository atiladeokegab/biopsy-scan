[project]
name = "preflight"
version = "0.1.0"
description = "GPU-accelerated spatial biomarker discovery, permutation screening, and routine IHC stain translation for cancer biopsies."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "numba>=0.60",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "modal>=1.6.4",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["core", "stats", "reimage", "bench", "audit", "atlas", "translate", "tests"]
