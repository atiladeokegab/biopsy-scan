site_name: Biopsy Scan
site_description: Simulate a spatial-biology study cell by cell on real tissue before you image a slide
repo_url: https://github.com/atiladeokegab/biopsy-scan
repo_name: atiladeokegab/biopsy-scan
edit_uri: blob/main/
docs_dir: docs
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
hooks:
  - scripts/mkdocs_hooks.py
markdown_extensions:
  - tables
  - admonition
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Results: RESULTS.md
  - Get started:
      - GPU runs: GPU.md
      - Data and licences: data.md
  - How it works:
      - Architecture: ARCHITECTURE.md
      - Contract: CONTRACT.md
  - Validation:
      - Pre-registration: PREREGISTRATION.md
      - External agreement: external-agreement.md
      - Basel external validation: external-validation.md
      - Basel validation protocol: external-validation-protocol.md
      - Negative result: negative-result.md
      - Prior work: PRIOR-WORK.md
  - Contribute:
      - Contributing: CONTRIBUTING.md
      - Code of conduct: CODE_OF_CONDUCT.md
      - Security: SECURITY.md
  - Hackathon archive (historical):
      - Product requirements v5: PRD.md
      - Judging evidence: JUDGING.md
      - Submission: SUBMISSION.md
      - Demo design spec: design.md
