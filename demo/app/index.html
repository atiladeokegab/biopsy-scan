<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preflight · Team Dry Lab</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face { font-family: "Inter"; src: url("../fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Instrument Serif"; src: url("../fonts/InstrumentSerif-400-latin.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "JetBrains Mono"; src: url("../fonts/JetBrainsMono-400-latin.woff2") format("woff2"); font-display: swap; }
    :root { --bg:#0A0E14; --panel:#111823; --scope:#05080C; --ink:#F3EFE6; --body:#B8C0CC; --muted:#7D8796; --hair:rgba(243,239,230,.12);
      --emerald:#2BD4A4; --coral:#E86F51;
      --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--body); font: 14px/1.4 var(--sans); }
    body { display: grid; grid-template-rows: auto minmax(0,1fr); height: 100dvh; overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--hair); }
    h1 { font: 30px/1 var(--serif); color: var(--ink); margin: 0 12px 0 0; white-space: nowrap; }
    h1 .team { font: 500 12px/1 var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--emerald, #2BD4A4); margin-left: 10px; vertical-align: middle; }
    button, .nav { all: unset; cursor: pointer; white-space: nowrap; }
    :is(button, .nav):focus-visible { outline: 2px solid var(--emerald); outline-offset: 2px; }
    .tabs { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--hair); border-radius: 999px; margin-right: auto; }
    .tabs button { padding: 6px 14px; border-radius: 999px; font: 500 13px var(--sans); color: var(--muted); }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
    .tabs button:disabled { cursor: default; opacity: .4; }
    .clock { font: 15px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; min-width: 12ch; text-align: right; }
    #run { padding: 9px 20px; border-radius: 999px; background: var(--emerald); color: var(--bg); font: 600 14px var(--sans); }
    #run:disabled { opacity: .45; cursor: default; }
    #reset, .nav { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--hair); color: var(--body); font: 500 13px var(--sans); }
    .nav { font: 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    :is(#reset, .nav):hover { color: var(--ink); }
    main { min-height: 0; display: grid; }
    .panels { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; padding: 16px 24px 24px; min-height: 0; }
    .panels[hidden] { display: none; }
    .panel { display: flex; flex-direction: column; gap: 10px; min-height: 0; background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 16px 16px; }
    .head { min-height: 30px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h2 { font: 26px/1.1 var(--serif); color: var(--ink); margin: 0; }
    #ours h2 { color: var(--emerald); }
    .readout { display: flex; gap: 16px; font: 14px var(--mono); color: var(--body); font-variant-numeric: tabular-nums; }
    .readout b { font-weight: 400; color: var(--ink); }
    .bar { height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--coral); }
    #ours .bar i { background: var(--emerald); }
    .replay { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(43,212,164,.4); font: 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--emerald); white-space: nowrap; }
    .src { margin: 0; font: 11px var(--mono); color: var(--muted); }
    .stage { position: relative; flex: 1; min-height: 0; border-radius: 10px; background: var(--scope); overflow: hidden; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .readout { align-items: baseline; }
    #to-ihc { align-self: center; margin: -6px 0; padding: 5px 14px; border-radius: 999px; background: var(--emerald); color: var(--bg); font: 600 13px var(--sans);
      box-shadow: 0 0 18px rgba(43,212,164,.45); }
    #to-ihc[hidden] { display: none; }
    @media (max-width: 1100px) { h1 { font-size: 24px; } .nav { display: none; } }
    @media (max-width: 760px) {
      body { overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100dvh; }
      header { flex-wrap: wrap; gap: 10px 8px; padding: 12px 16px; } h1 { width: 100%; } .tabs { margin-right: 0; width: 100%; } .tabs button { flex: 1; text-align: center; }
      .clock { min-width: 0; font-size: 13px; margin-right: auto; } #run { padding: 9px 14px; }
      .panels { grid-template-columns: minmax(0,1fr); padding: 12px 16px 16px; }
      .stage { flex: none; aspect-ratio: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Preflight <span class="team">Team Dry Lab</span></h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-1" aria-selected="true" aria-controls="step-1">1. Speed Race</button>
      <button type="button" role="tab" id="tab-2" aria-selected="false" aria-controls="step-2" disabled>2. Routine IHC</button>
    </div>
    <span class="replay" title="Elapsed time and studies done are replayed from measured per-study rates; the totals are projections">Throughput replay</span>
    <span class="clock" id="clock" aria-live="off">0.0s / 10.0s</span>
    <button type="button" id="run" disabled>Run 10s Speed Race</button>
    <button type="button" id="reset">Reset</button>
    <a class="nav" href="report.pdf" download>Report</a>
  </header>
  <main>
    <section class="panels" id="step-1" role="tabpanel" aria-labelledby="tab-1">
      <article class="panel" id="current">
        <div class="head"><h2>Current</h2><div class="readout"><b data-n></b><span data-time></span></div></div>
        <div class="bar"><i data-bar></i></div>
        <p class="src" data-src></p>
        <div class="stage"><canvas data-canvas></canvas></div>
      </article>
      <article class="panel" id="ours">
        <div class="head"><h2>Ours</h2><div class="readout"><b data-n></b><span data-time></span><button type="button" id="to-ihc" hidden>View Routine IHC</button></div></div>
        <div class="bar"><i data-bar></i></div>
        <p class="src" data-src></p>
        <div class="stage"><canvas data-canvas></canvas></div>
      </article>
    </section>
    <section class="panels" id="step-2" role="tabpanel" aria-labelledby="tab-2" hidden>
      <article class="panel">
        <div class="head"><h2>Multiplex panel</h2></div>
        <div class="stage"><canvas id="stack"></canvas></div>
      </article>
      <article class="panel">
        <div class="head"><h2>Routine IHC</h2></div>
        <div class="stage"><canvas id="ihc"></canvas></div>
      </article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
