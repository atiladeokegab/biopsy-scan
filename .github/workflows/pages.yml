name: pages
# Publishes the static demo/ (and only demo/) to GitHub Pages on every push to integration.
# demo/data is already public in this repo; nothing else is uploaded. Needs Settings > Pages >
# Source = "GitHub Actions" once (and the github-pages environment allowing the integration branch).
on:
  push:
    branches: [integration]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: validate the demo data
        run: python3 -I demo/check_data.py demo/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
