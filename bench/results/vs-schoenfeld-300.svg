<text x="690" y="84.1" fill="#b5462f" font-weight="bold">ANALYTIC (formula)</text>
<text x="690" y="292.3" fill="#2f7d4f" font-weight="bold">MEASURED (sim)</text>
<text x="690" y="308.3" fill="#2f7d4f" font-size="11">band: 95% interval</text>
<text x="12" y="506" font-weight="bold">Mixed: the formula overstates at 6 and understates at 1 of 7 patient counts.</text>
<text x="12" y="530" fill="#555" font-size="12">MEASURED (sim) = model-based Monte Carlo (frozen snapshot of the atlas code, ab0ae72 + working tree): 300 planted-effect studies per point, re-imaged cell</text>
<text x="12" y="547" fill="#555" font-size="12">by cell from real tissue, maxT at one calibrated threshold per design; null-study FWER 0.020 to 0.070.</text>
<text x="12" y="564" fill="#555" font-size="12">ANALYTIC = Schoenfeld (1983) events formula for a per-SD covariate (Hsieh and Lavori 2000),</text>
<text x="12" y="581" fill="#555" font-size="12">D = patients x event fraction, Bonferroni; it assumes exact, whole-tissue measurement.</text>
