<text x="690" y="84.1" fill="#b5462f" font-weight="bold">ANALYTIC (formula)</text>
<text x="690" y="111.0" fill="#666" font-weight="bold">ESTIMATE (sim), control</text>
<text x="690" y="127.0" fill="#666" font-size="11">full core, 0% mis-called</text>
<text x="690" y="289.8" fill="#2f7d4f" font-weight="bold">ESTIMATE (sim)</text>
<text x="690" y="305.8" fill="#2f7d4f" font-size="11">band: 95% interval</text>
<text x="12" y="506" font-weight="bold">The formula overstates power at 5 of 7 patient counts (outside the simulation&#x27;s 95% interval); inside it at the other 2.</text>
<text x="12" y="530" fill="#555" font-size="12">ESTIMATE (sim) = model-based Monte Carlo (frozen snapshot of the atlas code, ab0ae72 + working tree): 60 planted-effect studies per point,</text>
<text x="12" y="547" fill="#555" font-size="12">re-imaged cell by cell from real tissue, maxT at one calibrated threshold per design.</text>
<text x="12" y="564" fill="#555" font-size="12">Null-study FWER: main 0.000 to 0.100 (highest at 120 patients, 95% CI 0.012 to 0.317);</text>
<text x="12" y="581" fill="#555" font-size="12">control 0.000 to 0.100 (highest at 80 patients).</text>
<text x="12" y="598" fill="#555" font-size="12">ANALYTIC = Schoenfeld (1983) events formula for a per-SD covariate (Hsieh and Lavori 2000),</text>
<text x="12" y="615" fill="#555" font-size="12">D = patients x event fraction, Bonferroni; it assumes exact, whole-tissue measurement.</text>
</svg>
